<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Candidatos - Eleições 2026 - MG</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="topo">
    <h1>Candidatos - Eleições 2026 - MG</h1>
</header>

<main class="conteudo">

    <form method="get" th:action="@{/}" class="filtros">
        <div class="campo">
            <label for="texto">Buscar por nome / número</label>
            <input type="text" id="texto" name="texto" placeholder="Ex: Ana, 1240..."
                   th:value="${textoSelecionado}">
        </div>

        <div class="campo">
            <label for="cargo">Cargo</label>
            <select id="cargo" name="cargo">
                <option value="">Todos</option>
                <option th:each="c : ${cargos}"
                        th:value="${c}"
                        th:text="${c}"
                        th:selected="${c == cargoSelecionado}"></option>
            </select>
        </div>

        <div class="campo">
            <label for="partido">Partido</label>
            <select id="partido" name="partido">
                <option value="">Todos</option>
                <option th:each="p : ${partidos}"
                        th:value="${p}"
                        th:text="${p}"
                        th:selected="${p == partidoSelecionado}"></option>
            </select>
        </div>

        <button type="submit" class="filtrar">Filtrar</button>
        <a th:href="@{/}" class="limpar">Limpar</a>
    </form>

    <p class="contagem" th:if="${total > 0}">
        <span th:text="${total}">0</span> candidato(s) encontrado(s).
    </p>

    <p class="vazio" th:if="${total == 0}">Nenhum candidato encontrado com os filtros informados.</p>

    <section class="grade-candidatos">
        <div class="card" th:each="cand : ${candidatos}">
            <img th:src="@{'/images/candidatos/' + ${cand.nomeArquivoFoto}}"
                 th:alt="${cand.nomeUrna}" class="foto-candidato"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <div class="sem-foto">Sem foto</div>

            <div class="info">
                <h2 class="nome-urna" th:text="${cand.nomeUrna}">Nome de urna</h2>
                <p class="numero">Número: <span th:text="${cand.nrCandidato}">0</span></p>
                <p class="cargo" th:text="${cand.cargo}">Cargo</p>
                <p th:text="${cand.siglaPartido + ' - ' + cand.nomePartido}">Partido</p>
                <p th:text="${cand.municipio}">Município</p>
                <p th:if="${cand.situacaoCandidatura != null and !cand.situacaoCandidatura.isBlank() and cand.situacaoCandidatura != '#NE' and cand.situacaoCandidatura != '#NULO'}"
                   th:text="${cand.situacaoCandidatura}">Situação</p>
                <p th:if="${cand.idade >= 0}" th:text="${cand.idade + ' anos'}">0 anos</p>
                <p th:if="${cand.ocupacao != null and !cand.ocupacao.isBlank() and cand.ocupacao != '#NULO'}"
                   th:text="${cand.ocupacao}">Ocupação</p>
                <p th:if="${cand.grauInstrucao != null and !cand.grauInstrucao.isBlank() and cand.grauInstrucao != '#NULO'}"
                   th:text="${cand.grauInstrucao}">Escolaridade</p>
                <p class="nome-civil" th:text="${cand.nomeCandidato}">Nome civil</p>
            </div>
        </div>
    </section>
</main>

</body>
</html>
