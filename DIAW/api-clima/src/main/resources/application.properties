spring.application.name=clima-api
server.port=8080

# Coordenadas de Belo Horizonte - MG (usadas como padrao do endpoint /clima)
clima.default-city=Belo Horizonte
clima.default-latitude=-19.9167
clima.default-longitude=-43.9345

# Base URL da API Open-Meteo (gratuita, sem necessidade de API Key)
clima.openmeteo.base-url=https://api.open-meteo.com/v1/forecast
