<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraLogin - Recuperar senha</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="card">
        <div class="brand"><h1>AuraLogin</h1></div>
        <p class="subtitle">Informe seu email cadastrado</p>

        <div th:if="${infoMessage}" class="alert alert-success" th:text="${infoMessage}"></div>

        <form th:action="@{/recoverpassword}" method="post">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <button type="submit" class="btn">Enviar instrucoes</button>
        </form>

        <div class="links" style="justify-content:center;">
            <a th:href="@{/login}">Voltar para o login</a>
        </div>
    </div>
</body>
</html>
