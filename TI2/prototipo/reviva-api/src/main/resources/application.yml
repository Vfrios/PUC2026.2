spring:
  application:
    name: reviva-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

reviva:
  jwt:
    secret: ${JWT_SECRET:reviva-dev-jwt-secret-2026-chave-com-256-bits-minimo}
    expiration-minutes: 1440
  notificacoes:
    expiracao-dias: ${NOTIFICACOES_EXPIRACAO_DIAS:30}

server:
  port: ${PORT:8080}

logging:
  level:
    root: INFO
    com.reviva.api: DEBUG
    org.hibernate.SQL: WARN
    org.springframework.web: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # Arquivo local: cresce e persiste entre reinícios (ao contrário do H2 em
    # memória de antes). A pasta "db" é criada automaticamente pelo SQLite se
    # não existir; ver Dockerfile para garantir que ela também exista lá.
    url: jdbc:sqlite:./db/reviva.db?busy_timeout=15000&journal_mode=WAL
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-timeout: 20000
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:sqlite:./db/reviva.db?busy_timeout=15000&journal_mode=WAL
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-timeout: 20000
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
