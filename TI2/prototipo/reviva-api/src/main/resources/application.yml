spring:
  application:
    name: reviva-api

  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

reviva:
  jwt:
    secret: ${JWT_SECRET:troque-esta-chave-em-producao-para-algo-bem-longo-e-aleatorio}
    expiration-minutes: 1440

server:
  port: 8080

logging:
  level:
    root: INFO
    com.reviva.api: DEBUG
    org.hibernate.SQL: WARN
    org.springframework.web: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:reviva;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reviva}
    username: ${DB_USER:reviva}
    password: ${DB_PASSWORD:reviva}
    driver-class-name: org.postgresql.Driver
