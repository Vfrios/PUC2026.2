spring:
  application:
    name: reviva-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/reviva}
      database: ${MONGODB_DATABASE:reviva}
      auto-index-creation: true

reviva:
  jwt:
    secret: ${JWT_SECRET:reviva-dev-jwt-secret-2026-chave-com-256-bits-minimo}
    expiration-minutes: 1440
  notificacoes:
    expiracao-dias: ${NOTIFICACOES_EXPIRACAO_DIAS:30}

server:
  port: ${PORT:8080}

logging:
  level:
    root: INFO
    com.reviva.api: DEBUG
    org.hibernate.SQL: WARN
    org.springframework.web: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
